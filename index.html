<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수능 OMR 카드 실전 마킹 및 자동 채점 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .menu-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        select, button, input[type="text"] { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }

        /* 전체 정답 일괄 입력 카드 */
        .bulk-input-card { background: #eef5ff; border: 1px solid #b8daff; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .bulk-input-card label { display: block; font-weight: bold; margin-bottom: 8px; color: #004085; }
        .bulk-input-card input { width: 100%; font-size: 16px; padding: 8px 12px; }

        /* OMR 카드 이미지와 마킹 레이어가 겹쳐지는 부모 박스 */
        .omr-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .omr-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 이미지 위에 올라가는 마킹 포인트 레이어 */
        .bubble-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 개별 마킹 동그라미 스타일 */
        .omr-bubble {
            position: absolute;
            width: 1.8%;   
            height: 1.3%;  
            border-radius: 50%;
            cursor: pointer;
            background: rgba(0, 0, 0, 0);
            transition: background 0.1s;
        }
        .omr-bubble:hover {
            background: rgba(0, 0, 0, 0.2);
        }
        .omr-bubble.checked {
            background: rgba(0, 0, 0, 0.9) !important;
        }

        /* 개별 정답 확인용 패널 */
        .answer-check-section { margin-top: 30px; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .answer-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 250px; overflow-y: auto; padding: 5px; }
        .answer-item { display: flex; flex-direction: column; align-items: center; width: 45px; }
        .answer-item span { font-size: 11px; font-weight: bold; margin-bottom: 3px; }
        .answer-item input { width: 40px; text-align: center; padding: 4px; font-size: 14px; }

        /* 결과창 */
        .result-box { margin-top: 20px; padding: 15px; background: #e8f4fd; border-left: 5px solid #007bff; border-radius: 4px; display: none; }
        .result-box h3 { margin-top: 0; }
        .incorrect { color: #d9534f; font-weight: bold; }
        .correct { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>수능 OMR 카드 실전 마킹 시뮬레이터</h2>
    
    <div class="menu-bar">
        <select id="subjectSelect" onchange="changeSubject()">
            <option value="korean">국어 영역 (45문항)</option>
            <option value="math">수학 영역 (30문항)</option>
            <option value="english">영어 영역 (45문항)</option>
            <option value="history">한국사 영역 (20문항)</option>
            <option value="inquiry">탐구 영역 (20문항)</option>
            <option value="second">제2외국어/한문 (30문항)</option>
        </select>
        <button onclick="resetMarking()">전체 초기화</button>
        <button onclick="gradeExam()" style="background-color: #28a745;">채점하기</button>
    </div>

    <!-- 전체 정답 일괄 입력 카드 -->
    <div class="bulk-input-card">
        <label for="bulkAnswerInput">⚡ 전체 정답 통째로 입력 (예: 1.3.4.1.1 또는 13411):</label>
        <input type="text" id="bulkAnswerInput" placeholder="마침표, 쉼표, 공백 또는 연속 숫자로 입력하세요" oninput="applyBulkAnswers()">
    </div>

    <!-- OMR 카드 이미지 + 인터랙티브 마킹 레이어 -->
    <div class="omr-container" id="omrContainer">
        <img id="omrImage" src="images/korean.png" alt="OMR 카드">
        <div class="bubble-overlay" id="bubbleOverlay"></div>
    </div>

    <!-- 개별 정답 입력 확인용 패널 -->
    <div class="answer-check-section">
        <h3>📋 문항별 정답 확인 및 수정</h3>
        <div class="answer-grid" id="answerGridContainer"></div>
    </div>

    <div id="resultBox" class="result-box">
        <h3>채점 결과</h3>
        <p id="scoreDisplay"></p>
        <div id="detailDisplay"></div>
    </div>
</div>

<script>
    // --- 각 과목별 동적 좌표 생성 함수 ---

    // 1. 국어 영역 (45문항) 좌표 생성
    function generateKoreanCoords() {
        let coords = [];
        for (let i = 1; i <= 45; i++) {
            let leftBase = 0, topBase = 0, rowIdx = 0;
            if (i <= 17) { leftBase = 39.5; topBase = 26.5; rowIdx = i - 1; }
            else if (i <= 34) { leftBase = 57.5; topBase = 26.5; rowIdx = i - 18; }
            else { leftBase = 77.0; topBase = 35.8; rowIdx = i - 35; }

            let yPos = topBase + (rowIdx * 3.42);
            let xList = [];
            for (let b = 1; b <= 5; b++) { xList.push(leftBase + ((b - 1) * 1.55)); }
            coords.push({ q: i, x: xList, y: yPos });
        }
        return coords;
    }

    // 2. 수학 영역 (30문항) 좌표 생성 (객관식 1~22번, 단답형 16~30번 등 수능 수학 양식 반영)
    function generateMathCoords() {
        let coords = [];
        for (let i = 1; i <= 30; i++) {
            let leftBase = 39.5, topBase = 26.5, rowIdx = 0;
            if (i <= 10) { leftBase = 35.8; topBase = 96 / 3.6 + (i-1)*3.42; rowIdx = i-1; } // 예시 구조 보정
            
            // 수학 양식의 다단 배치 구조에 맞춘 좌표 패턴
            let col = Math.floor((i - 1) / 10); // 0열(1~10), 1열(11~20), 2열(21~30) 근사치
            // 수학 영역 정밀 배치
            let xList = [];
            let lBase = 36.0 + (col * 18.0);
            if(i > 22) lBase = 72.0; // 선택과목/후반부
            
            let rIdx = (i - 1) % 10;
            let yPos = 26.5 + (rIdx * 3.42);
            if (i > 10 && i <= 20) { lBase = 54.0; yPos = 26.5 + ((i-11)*3.42); }
            if (i > 20 && i <= 28) { lBase = 72.0; yPos = 26.5 + ((i-21)*3.42); }

            for (let b = 1; b <= 5; b++) { xList.push(lBase + ((b - 1) * 1.55)); }
            coords.push({ q: i, x: xList, y: yPos });
        }
        return coords;
    }

    // 3. 일반적인 1열/2열 세로형 영역 공통 생성기 (영어 45, 한국사 20, 탐구 20, 제2외국어 30)
    function generateStandardCoords(count, columnsConfig) {
        let coords = [];
        // columnsConfig 예: [{start: 1, end: 20, left: 41.5, top: 26.5}] 형태로 컬럼별 배치
        let current = 1;
        columnsConfig.forEach(cfg => {
            for (let i = cfg.start; i <= cfg.end; i++) {
                let rowIdx = i - cfg.start;
                let yPos = cfg.top + (rowIdx * 3.42);
                let xList = [];
                for (let b = 1; b <= 5; b++) { xList.push(cfg.left + ((b - 1) * 1.55)); }
                coords.push({ q: i, x: xList, y: yPos });
            }
        });
        return coords;
    }

    // 과목별 데이터 세팅
    const subjectData = {
        korean: { count: 45, img: "images/korean.png", coords: generateKoreanCoords() },
        math: { count: 30, img: "images/math.png", coords: generateStandardCoords(30, [
            { start: 1, end: 10, left: 35.8, top: 26.5 },
            { start: 11, end: 20, left: 53.8, top: 26.5 },
            { start: 21, end: 30, left: 72.0, top: 26.5 }
        ])},
        english: { count: 45, img: "images/english.png", coords: generateStandardCoords(45, [
            { start: 1, end: 20, left: 41.0, top: 26.5 },
            { start: 21, end: 40, left: 63.5, top: 26.5 },
            { start: 41, end: 45, left: 86.0, top: 26.5 }
        ])},
        history: { count: 20, img: "images/history.png", coords: generateStandardCoords(20, [
            { start: 1, end: 20, left: 48.0, top: 26.5 }
        ])},
        inquiry: { count: 20, img: "images/inquiry.png", coords: generateStandardCoords(20, [
            { start: 1, end: 20, left: 45.0, top: 26.5 }
        ])},
        second: { count: 30, img: "images/second.png", coords: generateStandardCoords(30, [
            { start: 1, end: 20, left: 41.0, top: 26.5 },
            { start: 21, end: 30, left: 63.5, top: 26.5 }
        ])}
    };

    let userAnswers = {};

    function changeSubject() {
        const subKey = document.getElementById('subjectSelect').value;
        const data = subjectData[subKey];
        
        document.getElementById('omrImage').src = `images/${subKey}.png`;
        document.getElementById('bulkAnswerInput').value = '';
        
        const overlay = document.getElementById('bubbleOverlay');
        const answerGrid = document.getElementById('answerGridContainer');
        overlay.innerHTML = '';
        answerGrid.innerHTML = '';
        userAnswers = {};

        data.coords.forEach(item => {
            userAnswers[item.q] = null;

            item.x.forEach((xCoord, idx) => {
                const bNum = idx + 1;
                const bubble = document.createElement('div');
                bubble.className = 'omr-bubble';
                bubble.style.left = `${xCoord}%`;
                bubble.style.top = `${item.y}%`;
                bubble.title = `${item.q}번 - ${bNum}번`;
                
                bubble.onclick = function() {
                    toggleBubble(item.q, bNum);
                };
                
                bubble.id = `bubble_${item.q}_${bNum}`;
                overlay.appendChild(bubble);
            });

            const ansItem = document.createElement('div');
            ansItem.className = 'answer-item';
            ansItem.innerHTML = `
                <span>${item.q}번</span>
                <input type="text" id="ans_${item.q}" maxlength="1" placeholder="-">
            `;
            answerGrid.appendChild(ansItem);
        });

        document.getElementById('resultBox').style.display = 'none';
    }

    function toggleBubble(qNum, bNum) {
        const currentSelected = userAnswers[qNum];
        if (currentSelected !== null) {
            document.getElementById(`bubble_${qNum}_${currentSelected}`).classList.remove('checked');
        }
        if (currentSelected === bNum) {
            userAnswers[qNum] = null;
        } else {
            userAnswers[qNum] = bNum;
            document.getElementById(`bubble_${qNum}_${bNum}`).classList.add('checked');
        }
    }

    function applyBulkAnswers() {
        const rawInput = document.getElementById('bulkAnswerInput').value.trim();
        const subKey = document.getElementById('subjectSelect').value;
        const count = subjectData[subKey].count;

        if (!rawInput) {
            for (let i = 1; i <= count; i++) {
                document.getElementById(`ans_${i}`).value = '';
            }
            return;
        }

        let answers = [];
        if (/[.,\s]/.test(rawInput)) {
            answers = rawInput.split(/[.,\s]+/).filter(x => x !== '');
        } else {
            answers = rawInput.split('');
        }

        for (let i = 1; i <= count; i++) {
            const inputEl = document.getElementById(`ans_${i}`);
            if (inputEl) {
                inputEl.value = answers[i - 1] || '';
            }
        }
    }

    function resetMarking() {
        changeSubject();
    }

    function gradeExam() {
        const subKey = document.getElementById('subjectSelect').value;
        const count = subjectData[subKey].count;
        let score = 0;
        let detailsHtml = "<ul>";

        for (let i = 1; i <= count; i++) {
            const ansInput = document.getElementById(`ans_${i}`).value.trim();
            const correctAns = ansInput ? ansInput : null;
            const userAns = userAnswers[i] ? String(userAnswers[i]) : null;

            if (correctAns === null) {
                detailsHtml += `<li>문항 ${i}: 정답 미입력</li>`;
            } else if (userAns === correctAns) {
                score++;
                detailsHtml += `<li>문항 ${i}: <span class="correct">정답 (마킹: ${userAns || '없음'}, 정답: ${correctAns})</span></li>`;
            } else {
                detailsHtml += `<li>문항 ${i}: <span class="incorrect">오답 (마킹: ${userAns || '없음'}, 정답: ${correctAns})</span></li>`;
            }
        }
        detailsHtml += "</ul>";

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        document.getElementById('scoreDisplay').innerHTML = `총 문항수: <b>${count}문항</b> 중 <b>${score}문항</b> 정답`;
        document.getElementById('detailDisplay').innerHTML = detailsHtml;
    }

    window.onload = function() {
        changeSubject();
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수능 OMR 카드 실전 마킹 및 자동 채점 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .menu-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        select, button, input[type="text"] { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }

        /* 전체 정답 일괄 입력 카드 */
        .bulk-input-card { background: #eef5ff; border: 1px solid #b8daff; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .bulk-input-card label { display: block; font-weight: bold; margin-bottom: 8px; color: #004085; }
        .bulk-input-card input { width: 100%; font-size: 16px; padding: 8px 12px; }

        /* OMR 카드 원본 이미지 참고용 영역 */
        .omr-preview {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px auto;
            border: 2px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            background: #000;
        }
        .omr-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 마킹 인터페이스 패널 */
        .marking-section { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .question-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
        .question-row { display: flex; align-items: center; background: white; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 6px; justify-content: space-between; }
        .q-num { font-weight: bold; width: 45px; font-size: 15px; color: #333; }
        
        /* 마킹용 동그라미 버튼 스타일 */
        .bubbles { display: flex; gap: 6px; }
        .bubble {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #007bff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            color: #007bff;
            background: white;
            user-select: none;
            transition: 0.1s;
        }
        .bubble:hover { background-color: #e6f0ff; }
        .bubble.checked {
            background-color: #007bff;
            color: white;
        }

        /* 개별 정답 입력 칸 */
        .ans-input-box { display: flex; align-items: center; gap: 4px; }
        .ans-input-box span { font-size: 12px; color: #666; }
        .ans-input-box input { width: 35px; text-align: center; padding: 4px; font-size: 14px; }

        /* 결과창 */
        .result-box { margin-top: 20px; padding: 15px; background: #e8f4fd; border-left: 5px solid #007bff; border-radius: 4px; display: none; }
        .result-box h3 { margin-top: 0; }
        .incorrect { color: #d9534f; font-weight: bold; }
        .correct { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>수능 OMR 카드 실전 마킹 및 자동 채점 시뮬레이터</h2>
    
    <div class="menu-bar">
        <select id="subjectSelect" onchange="changeSubject()">
            <option value="korean">국어 영역 (45문항)</option>
            <option value="math">수학 영역 (30문항)</option>
            <option value="english">영어 영역 (45문항)</option>
            <option value="history">한국사 영역 (20문항)</option>
            <option value="inquiry">탐구 영역 (20문항)</option>
            <option value="second">제2외국어/한문 (30문항)</option>
        </select>
        <button onclick="resetMarking()">전체 초기화</button>
        <button onclick="gradeExam()" style="background-color: #28a745;">채점하기</button>
    </div>

    <!-- 전체 정답 일괄 입력 카드 -->
    <div class="bulk-input-card">
        <label for="bulkAnswerInput">⚡ 전체 정답 통째로 입력 (예: 1.3.4.1.1 또는 13411):</label>
        <input type="text" id="bulkAnswerInput" placeholder="마침표, 쉼표, 공백 또는 연속 숫자로 입력하세요" oninput="applyBulkAnswers()">
    </div>

    <!-- OMR 카드 원본 이미지 참고용 -->
    <div class="omr-preview">
        <img id="omrImage" src="images/korean.png" alt="OMR 카드 참고 이미지">
    </div>

    <!-- 인터랙티브 마킹 구역 (터치 오류 원천 차단형 UI) -->
    <div class="marking-section">
        <h3 style="margin-top:0; margin-bottom:15px;">📝 OMR 답안 마킹 및 정답 입력</h3>
        <div class="question-grid" id="questionGridContainer"></div>
    </div>

    <div id="resultBox" class="result-box">
        <h3>채점 결과</h3>
        <p id="scoreDisplay"></p>
        <div id="detailDisplay"></div>
    </div>
</div>

<script>
    // 과목별 문항 수 설정
    const subjectConfig = {
        korean: { count: 45, name: "국어 영역" },
        math: { count: 30, name: "수학 영역" },
        english: { count: 45, name: "영어 영역" },
        history: { count: 20, name: "한국사 영역" },
        inquiry: { count: 20, name: "탐구 영역" },
        second: { count: 30, name: "제2외국어/한문 영역" }
    };

    let userAnswers = {};

    function changeSubject() {
        const subKey = document.getElementById('subjectSelect').value;
        const config = subjectConfig[subKey];
        
        // 이미지 경로 업데이트
        document.getElementById('omrImage').src = `images/${subKey}.png`;
        document.getElementById('bulkAnswerInput').value = '';
        
        const container = document.getElementById('questionGridContainer');
        container.innerHTML = '';
        userAnswers = {};

        // 문항별 마킹 카드 생성
        for (let i = 1; i <= config.count; i++) {
            userAnswers[i] = null;

            const row = document.createElement('div');
            row.className = 'question-row';

            let rowHtml = `<div class="q-num">${i}번</div><div class="bubbles">`;
            for (let b = 1; b <= 5; b++) {
                rowHtml += `<div class="bubble" id="bubble_${i}_${b}" onclick="selectBubble(${i}, ${b})">${b}</div>`;
            }
            rowHtml += `</div>`;

            // 문항별 정답 입력 칸 (일괄 입력 연동)
            rowHtml += `<div class="ans-input-box">
                            <span>정답:</span>
                            <input type="text" id="ans_${i}" maxlength="1" placeholder="-">
                        </div>`;

            row.innerHTML = rowHtml;
            container.appendChild(row);
        }

        document.getElementById('resultBox').style.display = 'none';
    }

    // 마킹 선택 및 해제 함수
    function selectBubble(qNum, bNum) {
        const currentSelected = userAnswers[qNum];

        // 기존 선택 해제
        if (currentSelected !== null) {
            document.getElementById(`bubble_${qNum}_${currentSelected}`).classList.remove('checked');
        }

        // 같은 번호를 다시 누르면 취소, 다른 번호면 새로 선택
        if (currentSelected === bNum) {
            userAnswers[qNum] = null;
        } else {
            userAnswers[qNum] = bNum;
            document.getElementById(`bubble_${qNum}_${bNum}`).classList.add('checked');
        }
    }

    // 전체 정답 일괄 입력 처리
    function applyBulkAnswers() {
        const rawInput = document.getElementById('bulkAnswerInput').value.trim();
        const subKey = document.getElementById('subjectSelect').value;
        const count = subjectConfig[subKey].count;

        if (!rawInput) {
            for (let i = 1; i <= count; i++) {
                document.getElementById(`ans_${i}`).value = '';
            }
            return;
        }

        let answers = [];
        if (/[.,\s]/.test(rawInput)) {
            answers = rawInput.split(/[.,\s]+/).filter(x => x !== '');
        } else {
            answers = rawInput.split('');
        }

        for (let i = 1; i <= count; i++) {
            const inputEl = document.getElementById(`ans_${i}`);
            if (inputEl) {
                inputEl.value = answers[i - 1] || '';
            }
        }
    }

    function resetMarking() {
        changeSubject();
    }

    // 채점하기 기능
    function gradeExam() {
        const subKey = document.getElementById('subjectSelect').value;
        const count = subjectConfig[subKey].count;
        let score = 0;
        let detailsHtml = "<ul>";

        for (let i = 1; i <= count; i++) {
            const ansInput = document.getElementById(`ans_${i}`).value.trim();
            const correctAns = ansInput ? ansInput : null;
            const userAns = userAnswers[i] ? String(userAnswers[i]) : null;

            if (correctAns === null) {
                detailsHtml += `<li>문항 ${i}: 정답 미입력</li>`;
            } else if (userAns === correctAns) {
                score++;
                detailsHtml += `<li>문항 ${i}: <span class="correct">정답 (마킹: ${userAns || '없음'}, 정답: ${correctAns})</span></li>`;
            } else {
                detailsHtml += `<li>문항 ${i}: <span class="incorrect">오답 (마킹: ${userAns || '없음'}, 정답: ${correctAns})</span></li>`;
            }
        }
        detailsHtml += "</ul>";

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        document.getElementById('scoreDisplay').innerHTML = `총 문항수: <b>${count}문항</b> 중 <b>${score}문항</b> 정답`;
        document.getElementById('detailDisplay').innerHTML = detailsHtml;
    }

    window.onload = function() {
        changeSubject();
    };
</script>

</body>
</html>

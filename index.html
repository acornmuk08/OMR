<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수능 OMR 마킹 및 자동 채점 프로그램</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .menu-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        select, button, input[type="text"] { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .workspace { display: flex; flex-direction: column; gap: 20px; }
        .omr-preview { width: 100%; border: 2px solid #ddd; border-radius: 5px; overflow: hidden; background: #000; text-align: center; }
        .omr-preview img { width: 100%; height: auto; display: block; opacity: 0.85; }
        
        /* 일괄 정답 입력창 스타일 */
        .bulk-input-card { background: #eef5ff; border: 1px solid #b8daff; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .bulk-input-card label { display: block; font-weight: bold; margin-bottom: 8px; color: #004085; }
        .bulk-input-card input { width: 100%; font-size: 16px; padding: 8px 12px; }

        /* 마킹 인터페이스 영역 */
        .marking-section { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .question-row { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; border-bottom: 1px dashed #ddd; padding-bottom: 6px; }
        .q-num { font-weight: bold; width: 50px; }
        .bubbles { display: flex; gap: 8px; }
        .bubble { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #007bff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: #007bff; background: white; user-select: none; transition: 0.1s; }
        .bubble.checked { background-color: #007bff; color: white; }
        
        /* 문항별 정답 입력란 */
        .answer-input-box { margin-left: auto; display: flex; gap: 5px; align-items: center; }
        .answer-input-box input { width: 55px; padding: 5px; text-align: center; font-size: 14px; }

        /* 결과창 */
        .result-box { margin-top: 20px; padding: 15px; background: #e8f4fd; border-left: 5px solid #007bff; border-radius: 4px; display: none; }
        .result-box h3 { margin-top: 0; }
        .incorrect { color: #d9534f; font-weight: bold; }
        .correct { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>수능 OMR 자동 채점 시뮬레이터</h2>
    
    <div class="menu-bar">
        <select id="subjectSelect" onchange="changeSubject()">
            <option value="korean">국어 영역 (45문항)</option>
            <option value="math">수학 영역 (30문항)</option>
            <option value="english">영어 영역 (45문항)</option>
            <option value="history">한국사 영역 (20문항)</option>
            <option value="inquiry">탐구 영역 (각 20문항)</option>
            <option value="second">제2외국어/한문 (30문항)</option>
        </select>
        <button onclick="resetMarking()">초기화</button>
        <button onclick="gradeExam()" style="background-color: #28a745;">채점하기</button>
    </div>

    <!-- 일괄 정답 입력 영역 -->
    <div class="bulk-input-card">
        <label for="bulkAnswerInput">⚡ 전체 정답 한 번에 입력 (통째로 입력):</label>
        <input type="text" id="bulkAnswerInput" placeholder="예: 1.3.4.1.1 또는 13411 (마침표, 쉼표, 공백 모두 지원)" oninput="applyBulkAnswers()">
    </div>

    <div class="workspace">
        <!-- OMR 원본 이미지 참고용 -->
        <div class="omr-preview">
            <img id="omrImage" src="images/korean.png" alt="OMR 카드 원본">
        </div>

        <!-- 인터랙티브 마킹 구역 -->
        <div class="marking-section">
            <h3>📝 답안 마킹 및 개별 정답 확인</h3>
            <div id="questionContainer"></div>
        </div>
    </div>

    <div id="resultBox" class="result-box">
        <h3>채점 결과</h3>
        <p id="scoreDisplay"></p>
        <div id="detailDisplay"></div>
    </div>
</div>

<script>
    const subjectConfig = {
        korean: { count: 45, img: "images/korean.png" },
        math: { count: 30, img: "images/math.png" },
        english: { count: 45, img: "images/english.png" },
        history: { count: 20, img: "images/history.png" },
        inquiry: { count: 20, img: "images/inquiry.png" },
        second: { count: 30, img: "images/second.png" }
    };

    let userAnswers = {};

    function changeSubject() {
        const subject = document.getElementById('subjectSelect').value;
        const config = subjectConfig[subject];
        
        document.getElementById('omrImage').src = config.img;
        document.getElementById('bulkAnswerInput').value = ''; // 정답 입력창 초기화
        
        const container = document.getElementById('questionContainer');
        container.innerHTML = '';
        userAnswers = {};

        for (let i = 1; i <= config.count; i++) {
            userAnswers[i] = null;

            const row = document.createElement('div');
            row.className = 'question-row';

            let bubblesHtml = `<div class="q-num">${i}번</div><div class="bubbles">`;
            for (let b = 1; b <= 5; b++) {
                bubblesHtml += `<div class="bubble" onclick="selectBubble(${i}, ${b}, this)">${b}</div>`;
            }
            bubblesHtml += `</div>`;

            // 문항별 정답 입력 칸 (일괄 입력 시 자동으로 채워짐)
            bubblesHtml += `<div class="answer-input-box">
                                <label style="font-size:12px; color:#555;">정답:</label>
                                <input type="text" id="ans_${i}" placeholder="${i}">
                            </div>`;

            row.innerHTML = bubblesHtml;
            container.appendChild(row);
        }
        document.getElementById('resultBox').style.display = 'none';
    }

    // 통째로 입력한 정답 파싱하여 개별 입력란에 자동 적용
    function applyBulkAnswers() {
        const rawInput = document.getElementById('bulkAnswerInput').value.trim();
        const subject = document.getElementById('subjectSelect').value;
        const count = subjectConfig[subject].count;

        if (!rawInput) {
            for (let i = 1; i <= count; i++) {
                document.getElementById(`ans_${i}`).value = '';
            }
            return;
        }

        let answers = [];

        // 구분자('.', ',', 공백)가 포함되어 있는 경우 구분자로 분할
        if (/[.,\s]/.test(rawInput)) {
            answers = rawInput.split(/[.,\s]+/).filter(x => x !== '');
        } else {
            // 구분자가 없을 경우 1글자씩 분할 (예: 13411 -> ['1', '3', '4', '1', '1'])
            answers = rawInput.split('');
        }

        // 각 문항 입력란에 순서대로 대입
        for (let i = 1; i <= count; i++) {
            const inputEl = document.getElementById(`ans_${i}`);
            if (inputEl) {
                inputEl.value = answers[i - 1] || '';
            }
        }
    }

    function selectBubble(qNum, bNum, element) {
        const parent = element.parentNode;
        const bubbles = parent.getElementsByClassName('bubble');
        
        if (userAnswers[qNum] === bNum) {
            userAnswers[qNum] = null;
            element.classList.remove('checked');
        } else {
            for (let b of bubbles) {
                b.classList.remove('checked');
            }
            element.classList.add('checked');
            userAnswers[qNum] = bNum;
        }
    }

    function resetMarking() {
        changeSubject();
    }

    function gradeExam() {
        const subject = document.getElementById('subjectSelect').value;
        const count = subjectConfig[subject].count;
        let score = 0;
        let detailsHtml = "<ul>";

        for (let i = 1; i <= count; i++) {
            const ansInput = document.getElementById(`ans_${i}`).value.trim();
            const correctAns = ansInput ? ansInput : null;
            const userAns = userAnswers[i] ? String(userAnswers[i]) : null;

            if (correctAns === null) {
                detailsHtml += `<li>문항 ${i}: 정답 미입력</li>`;
            } else if (userAns === correctAns) {
                score++;
                detailsHtml += `<li>문항 ${i}: <span class="correct">정답 (마킹: ${userAns || '없음'}, 정답: ${correctAns})</span></li>`;
            } else {
                detailsHtml += `<li>문항 ${i}: <span class="incorrect">오답 (마킹: ${userAns || '없음'}, 정답: ${correctAns})</span></li>`;
            }
        }
        detailsHtml += "</ul>";

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        document.getElementById('scoreDisplay').innerHTML = `총 문항수: <b>${count}문항</b> 중 <b>${score}문항</b> 정답`;
        document.getElementById('detailDisplay').innerHTML = detailsHtml;
    }

    window.onload = function() {
        changeSubject();
    };
</script>

</body>
</html>
